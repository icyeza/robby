# WHO Robson Ten-Group Classification, rule set v1.0.
# Source: WHO Robson Classification Implementation Manual (2017).
# Every condition must be verified against the manual (by hand) before freezing.
# Edit the content, then re-stamp:  uv run python -m robson_engine.ruleset <this file>
version_label: "robson-v1.0"
checksum: "7a8d290d430aff3c757a802b3b3d11c3760b9847f4a073b0a27a2243b3724411"
consistency:
  - name: nulliparous_with_previous_cs
    when:
      - {field: parity, op: eq, value: 0}
      - {field: previous_cs_count, op: ge, value: 1}
groups:
  - group: 1
    name: "Nulliparous, single cephalic, >=37 weeks, spontaneous labour"
    conditions:
      - {field: parity, op: eq, value: 0}
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: eq, value: cephalic}
      - {field: gestational_age_weeks, op: ge, value: 37.0}
      - {field: onset_of_labour, op: eq, value: spontaneous}
  - group: 2
    name: "Nulliparous, single cephalic, >=37 weeks, induced or CS before labour"
    conditions:
      - {field: parity, op: eq, value: 0}
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: eq, value: cephalic}
      - {field: gestational_age_weeks, op: ge, value: 37.0}
      - {field: onset_of_labour, op: in, value: [induced, prelabour_cs]}
    subgroups:
      - {label: "2a", conditions: [{field: onset_of_labour, op: eq, value: induced}]}
      - {label: "2b", conditions: [{field: onset_of_labour, op: eq, value: prelabour_cs}]}
  - group: 3
    name: "Multiparous without previous CS, single cephalic, >=37 weeks, spontaneous labour"
    conditions:
      - {field: parity, op: ge, value: 1}
      - {field: previous_cs_count, op: eq, value: 0}
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: eq, value: cephalic}
      - {field: gestational_age_weeks, op: ge, value: 37.0}
      - {field: onset_of_labour, op: eq, value: spontaneous}
  - group: 4
    name: "Multiparous without previous CS, single cephalic, >=37 weeks, induced or CS before labour"
    conditions:
      - {field: parity, op: ge, value: 1}
      - {field: previous_cs_count, op: eq, value: 0}
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: eq, value: cephalic}
      - {field: gestational_age_weeks, op: ge, value: 37.0}
      - {field: onset_of_labour, op: in, value: [induced, prelabour_cs]}
    subgroups:
      - {label: "4a", conditions: [{field: onset_of_labour, op: eq, value: induced}]}
      - {label: "4b", conditions: [{field: onset_of_labour, op: eq, value: prelabour_cs}]}
  - group: 5
    name: "Multiparous with at least one previous CS, single cephalic, >=37 weeks"
    conditions:
      - {field: parity, op: ge, value: 1}
      - {field: previous_cs_count, op: ge, value: 1}
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: eq, value: cephalic}
      - {field: gestational_age_weeks, op: ge, value: 37.0}
    subgroups:
      - {label: "5a", conditions: [{field: previous_cs_count, op: eq, value: 1}]}
      - {label: "5b", conditions: [{field: previous_cs_count, op: ge, value: 2}]}
  - group: 6
    name: "Nulliparous, single breech"
    conditions:
      - {field: parity, op: eq, value: 0}
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: eq, value: breech}
  - group: 7
    name: "Multiparous, single breech, including previous CS"
    conditions:
      - {field: parity, op: ge, value: 1}
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: eq, value: breech}
  - group: 8
    name: "Multiple pregnancy, including previous CS"
    conditions:
      - {field: plurality, op: ge, value: 2}
  - group: 9
    name: "Single transverse or oblique lie, including previous CS"
    conditions:
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: in, value: [transverse, oblique]}
  - group: 10
    name: "Single cephalic, <37 weeks, including previous CS"
    conditions:
      - {field: plurality, op: eq, value: 1}
      - {field: fetal_presentation, op: eq, value: cephalic}
      - {field: gestational_age_weeks, op: lt, value: 37.0}
