[project]
name = "robson-serving"
version = "1.0.0"
description = "Serving runtime for the Robson readiness model: loader, feature rows, calibration, monitoring"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=2.2,<3",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "robson-engine",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
xgboost = ["xgboost>=3.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robson_serving"]
