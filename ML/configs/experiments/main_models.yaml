# The three main models (logistic regression, XGBoost, MLP) on every feature set FS0-FS4 and
# every missing-data strategy they support (M0 = native NaN handling, XGBoost only).
# Leave-one-hospital-out (S1) is the primary evaluation; 50 Optuna trials per fold.
model: [logreg_l2, xgboost, mlp]
feature_set: [FS0, FS1, FS2, FS3, FS4]
missing_strategy: [M0, M1, M2]
split: S1
population: P_pred
n_trials: 50
seed: 20260923
n_boot: 1000
---
# The same models on FS4 with local recalibration (S2) and internal cross-validation (S3),
# to measure how much performance drops when moving to an unseen hospital.
model: [logreg_l2, xgboost, mlp]
feature_set: FS4
missing_strategy: [M0, M1, M2]
split: [S2, S3]
population: P_pred
n_trials: 50
seed: 20260923
n_boot: 1000
