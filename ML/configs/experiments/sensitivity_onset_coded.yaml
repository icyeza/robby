# Sensitivity analysis: the older population definition that used the onset-of-labour field
# (P_pred_onset_coded: spontaneous or induced onset only). Onset is often recorded after
# delivery, so it leaks the outcome; these runs are for comparison only and can never be
# selected (the selection rule reads population P_pred only).
# B1 is untuned and reads one column, so it gets its own document and runs once.
model: B1
feature_set: FS4
missing_strategy: M0
split: S1
population: P_pred_onset_coded
n_trials: 50
seed: 20260923
n_boot: 1000
---
model: [logreg_l2, xgboost, mlp]
feature_set: FS4
missing_strategy: [M0, M1, M2]
split: S1
population: P_pred_onset_coded
n_trials: 50
seed: 20260923
n_boot: 1000
