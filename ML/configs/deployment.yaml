# The model that gets deployed: robson-ml fit-deploy configs/deployment.yaml
#
# This is the configuration chosen by the selection rule (configs/selection_rule.yaml):
# L2 logistic regression on feature set FS2 with iterative imputation (M2). It is refit on
# all four hospitals and saved to artefacts/<version_label>/.
#
# use_facility: auto adds facility_id to the inputs only if that lowers the internal
# cross-validated log loss (needs the runs in configs/experiments/deployment_check.yaml).
# true or false force the choice.
model: logreg_l2
feature_set: FS2
use_facility: auto
missing_strategy: M2
population: P_pred
seed: 20260923
n_trials: 50
version_label: readiness-v1.0
