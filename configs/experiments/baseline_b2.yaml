# Baseline B2 (spec §12.2): L2 logistic on the six Robson inputs (read from FS0; GA with
# spline terms), under S1, S2 and S3. Tuned only over a tiny C grid; median/mode imputation
# with missing indicators (M1).
model: B2
feature_set: FS0
missing_strategy: M1
split: [S1, S2, S3]
population: P_pred
n_trials: 50
seed: 20260923
n_boot: 1000
