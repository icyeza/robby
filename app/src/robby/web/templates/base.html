<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">
{% endif %}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>{% block title %}Robson Readiness{% endblock %} · Robson Readiness</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
{% block body %}
{% include "partials/_header.html" %}

<main class="page">
  {% include "partials/_banner.html" %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
</body>
</html>
