[project]
name = "robby"
version = "0.1.0"
description = "Robson Readiness: Robson classification and readiness signal for maternity units"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "robson-engine",
    "robson-serving",
    "sqlalchemy>=2.0",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
robby-admin = "robby.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robby"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
# These exceptions are control-flow signals named for the situation they report (like HTTP
# statuses: NotFound, Forbidden), not for being errors; an "Error" suffix would read worse.
"src/robby/errors.py" = ["N818"]
"src/robby/auth/dependencies.py" = ["N818"]
"src/robby/auth/service.py" = ["N818"]
"src/robby/rulesets.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
packages = ["robby"]
mypy_path = "src,../ML/packages/robson_engine/src,../ML/packages/robson_serving/src"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.uv.sources]
robson-engine = { path = "../ML/packages/robson_engine", editable = true }
robson-serving = { path = "../ML/packages/robson_serving", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
