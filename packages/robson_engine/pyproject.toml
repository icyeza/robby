[project]
name = "robson-engine"
version = "1.0.0"
description = "WHO Robson Ten-Group classification engine (constraint resolution, rule set as data)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robson_engine"]
