# nginx site for Robby. deploy/install.sh copies this to /etc/nginx/sites-available/robby and
# links it into sites-enabled; `certbot --nginx -d robby.example.org` then adds TLS
# (listen 443, certificate paths and the http to https redirect).
server {
    listen 80;
    server_name robby.example.org;

    # Excel uploads of a month of admissions stay well under this.
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8170;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass         http://127.0.0.1:8170;
        proxy_set_header   Host $host;
        expires            7d;
    }
}
